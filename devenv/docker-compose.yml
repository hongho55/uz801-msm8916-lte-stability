services:
  builder:
    image: devenv-builder
    build:
      context: ..
      dockerfile: devenv/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}

    container_name: openwrt-builder

    working_dir: /repo/openwrt

    stdin_open: true
    tty: true

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    network_mode: host

    volumes:
      - ..:/repo
      # Colima/virtiofs cannot reopen the mode-000 temp files GNU patch creates, so keep OpenWrt's tmp/ off the share.
      - owrt-tmp:/repo/openwrt/tmp

    command: ["/bin/bash"]

volumes:
  owrt-tmp:
    name: uz801-owrt-tmp
    external: true
